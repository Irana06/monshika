name: Rilis APK

# Dorong tag vX.Y.Z, sisanya jalan sendiri: build, tanda tangani, lalu rilis.
#   git tag v1.1.1 && git push origin v1.1.1
#
# Jalankan manual lewat tab Actions untuk sekadar uji build tanpa membuat rilis.
#
# Butuh empat secret di Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64  isi monshika-release.jks dalam base64
#   STORE_PASSWORD   sandi keystore
#   KEY_PASSWORD     sandi kunci
#   KEY_ALIAS        monshika
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.2
  # Sidik jari sertifikat rilis. Kalau build menghasilkan sidik jari lain,
  # artinya keystore-nya salah dan APK-nya tidak akan bisa dipasang di atas
  # versi yang sudah terpasang di HP pengguna.
  RELEASE_SHA1: 30ec3992f2bac29958c4721c7dc314e39642a712

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Cocokkan versi pubspec dengan tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)
          echo "tag=$TAG pubspec=$PUBSPEC"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag $TAG tidak sama dengan versi di pubspec.yaml ($PUBSPEC). Kalau beda, aplikasi akan terus menawarkan update yang sama setelah dipasang."
            exit 1
          fi

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi. Lihat catatan di atas berkas ini."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/monshika-release.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/monshika-release.jks"
          } > android/key.properties

      - name: Analisis
        run: flutter analyze --no-fatal-infos

      - name: Tes
        run: flutter test

      - name: Build APK per ABI
        run: flutter build apk --release --split-per-abi

      - name: Periksa tanda tangan dan versi
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SHA1=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -i 'SHA-1 digest' | awk '{print $NF}')
          echo "sidik jari: $SHA1"
          if [ "$SHA1" != "$RELEASE_SHA1" ]; then
            echo "::error::APK ditandatangani kunci yang salah. Update tidak akan bisa dipasang di atas versi lama."
            exit 1
          fi

      - name: Beri nama berkas sesuai pola updater
        id: pack
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "release/monshika-v$VERSION-$abi.apk"
          done
          ls -la release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Susun catatan rilis
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" notes.md
          else
            git log -1 --format=%B > notes.md
          fi
          printf '\n%s\n%s\n\n%s\n' \
            'Pilih APK sesuai HP-mu. Kebanyakan HP sekarang pakai **arm64-v8a**.' \
            'Datamu tetap aman saat update.' \
            '☕ Suka Monshika? Dukung di https://saweria.co/shicomp' >> notes.md

      - name: Simpan APK sebagai artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: monshika-apk
          path: release/*.apk

      - name: Buat rilis
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Monshika ${{ github.ref_name }}
          body_path: notes.md
          files: release/*.apk
          draft: false
          prerelease: false
